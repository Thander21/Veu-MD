<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="icon" type="image/svg+xml" href="/veu-logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&family=Roboto:ital,wght@0,300;0,400;0,500;0,700;1,400&family=Source+Code+Pro:wght@400;600&display=swap" rel="stylesheet" />
    <title>V.E.U. MD</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #0e0b16;
        color: #e2e8f0;
        overflow: hidden;
      }
      #splash-screen {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 50% 45%, #221538 0%, #140d24 55%, #0a0612 100%);
        z-index: 999999;
        transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.35s ease;
        user-select: none;
        -webkit-user-select: none;
      }
      #splash-screen.fade-out {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .splash-logo-container {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .splash-glow-behind {
        position: absolute;
        width: 220px;
        height: 220px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(192, 132, 252, 0.35) 0%, rgba(244, 114, 182, 0.15) 50%, transparent 70%);
        filter: blur(20px);
        animation: pulseAura 2.4s ease-in-out infinite alternate;
      }
      #splash-logo {
        position: relative;
        width: 180px;
        height: 180px;
        animation: gentleBreathe 2.4s ease-in-out infinite alternate;
        filter: drop-shadow(0 12px 28px rgba(0, 0, 0, 0.65));
      }
      @keyframes pulseAura {
        0% { transform: scale(0.9); opacity: 0.5; }
        100% { transform: scale(1.15); opacity: 0.95; }
      }
      @keyframes gentleBreathe {
        0% { transform: scale(0.98); }
        100% { transform: scale(1.02); }
      }
    </style>
  </head>
  <body>
    <div id="splash-screen">
      <div class="splash-logo-container">
        <div class="splash-glow-behind"></div>
        <img id="splash-logo" src="/veu-logo.svg" alt="V.E.U. MD" />
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
