<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Crepúsculo Editorial Theme: Obsidian / Deep Purple) -->
    <radialGradient id="bgGlow" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#221538"/>
      <stop offset="50%" stop-color="#140d24"/>
      <stop offset="100%" stop-color="#0a0612"/>
    </radialGradient>

    <!-- Squircle Shadow -->
    <filter id="squircleDropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.75"/>
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#c084fc" flood-opacity="0.22"/>
    </filter>

    <!-- Fita 1: "V"er / View (Violeta / Safira Crepuscular) -->
    <linearGradient id="gradView" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#7c3aed" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#581c87" stop-opacity="0.75"/>
    </linearGradient>

    <!-- Fita 2: "E"ditar / Edit (Púrpura Ametista / Neon Orchid) -->
    <linearGradient id="gradEdit" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.98"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#7e22ce" stop-opacity="0.82"/>
    </linearGradient>

    <!-- Fita 3: "U"sar / Use (Magenta Suave / Rosa Elétrico Límpido) -->
    <linearGradient id="gradUse" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.98"/>
      <stop offset="60%" stop-color="#e879f9" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#c026d3" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Glow dos Véus Sobrepostos -->
    <filter id="veilGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container Squircle do App (Estilo macOS / Windows 11 Modern) -->
  <rect x="40" y="40" width="432" height="432" rx="96" ry="96" fill="url(#bgGlow)" filter="url(#squircleDropShadow)" stroke="#382256" stroke-width="2"/>

  <!-- Borda sutil de vidro no topo (Efeito Glassmorphism) -->
  <rect x="42" y="42" width="428" height="216" rx="94" ry="94" fill="none" stroke="white" stroke-width="1.5" stroke-opacity="0.14"/>

  <!-- Grupo dos Véus Dinâmicos formando o "V" do V.E.U. MD -->
  <g transform="translate(0, 8)" filter="url(#veilGlow)">
    <!-- Camada 1 (Ver / View - Fita da Asa Esquerda Traseira) -->
    <path d="M 120 130 
             C 140 130, 200 240, 245 330 
             C 255 350, 265 350, 275 330 
             C 305 270, 340 200, 360 160 
             C 365 150, 360 145, 345 155 
             C 310 180, 270 260, 256 295 
             C 220 220, 160 130, 120 130 Z" 
          fill="url(#gradView)" 
          style="mix-blend-mode: screen;"/>

    <!-- Camada 2 (Editar / Edit - Fita de Conexão Translúcida Central) -->
    <path d="M 160 150 
             C 200 210, 235 300, 256 350 
             C 275 300, 330 190, 390 140 
             C 400 130, 385 130, 365 145 
             C 320 180, 275 280, 256 325 
             C 235 275, 195 180, 160 150 Z" 
          fill="url(#gradEdit)" 
          style="mix-blend-mode: screen;"/>

    <!-- Camada 3 (Usar / Use - Fita Frontal Ascendente e Iluminada) -->
    <path d="M 135 170 
             C 170 230, 220 330, 250 380 
             C 256 392, 264 392, 270 380 
             C 300 320, 350 220, 380 170 
             C 370 170, 330 240, 260 340 
             C 245 320, 190 220, 135 170 Z" 
          fill="url(#gradUse)" 
          style="mix-blend-mode: screen;"/>
          
    <!-- Centelha da Revelação da Palavra (Onde o Véu se Ergue) -->
    <circle cx="260" cy="355" r="9" fill="#fdf4ff" opacity="0.95"/>
    <circle cx="260" cy="355" r="24" fill="#e879f9" opacity="0.45" filter="blur(5px)"/>
  </g>

  <!-- Assinatura Oficial da Marca: V.E.U. MD -->
  <text x="256" y="435" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="700" letter-spacing="5" fill="#d8b4fe" opacity="0.85">V . E . U .  M D</text>
</svg>
