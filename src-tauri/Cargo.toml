[package]
name = "veu-md"
version = "0.3.0"
description = "Veu MD - Editor Markdown WYSIWYG Estilo Word com Temas e Terminal"
authors = ["Rahman"]
edition = "2021"

[lib]
name = "veu_md_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-shell = "2.0"
tauri-plugin-fs = "2.0"
tauri-plugin-dialog = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
portable-pty = "0.8"
notify = "6.1"
dirs = "5.0"
uuid = { version = "1.10", features = ["v4"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true

